<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Login | Attendance System</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Poppins", system-ui, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at 0% 0%, #1abc9c22, transparent 50%),
                radial-gradient(circle at 100% 100%, #9b59b622, transparent 50%),
                linear-gradient(135deg, #0f172a, #020617);
}

.login-card {
    width: 380px;
    padding: 35px;
    background: rgba(15, 23, 42, 0.85);
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, .6);
    backdrop-filter: blur(18px);
    color: white;
}

.login-card h1 {
    text-align: center;
    margin-bottom: 10px;
}

.login-card p {
    text-align: center;
    color: #9ca3af;
    margin-bottom: 25px;
}

.input-group {
    margin-bottom: 18px;
}

.input-group label {
    font-size: 13px;
    color: #cbd5e1;
}

.input-group input {
    width: 100%;
    margin-top: 6px;
    padding: 10px;
    border-radius: 12px;
    background: #020617;
    border: 1px solid #1f2937;
    color: white;
}

button {
    width: 100%;
    padding: 12px;
    border-radius: 999px;
    border: none;
    background: linear-gradient(135deg, #38bdf8, #6366f1);
    color: #020617;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
}

.error {
    color: #ef4444;
    font-size: 13px;
    margin-top: 10px;
    text-align: center;
}
</style>
</head>

<body>
<div class="login-card">
    <h1>Attendance Login</h1>
    <p>Login to manage attendance</p>

    <div class="input-group">
        <label>Username</label>
        <input id="username" placeholder="Enter username">
    </div>

    <div class="input-group">
        <label>Password</label>
        <input id="password" type="password" placeholder="Enter password">
    </div>

    <button onclick="login()">Login</button>
    <div class="error" id="error"></div>
</div>

<script>
const USERS = [
    { username: "Yoshita", password: "241FA04660" },
    { username: "Karthikeyan", password: "241FA04736" },
    { username: "Harshitha", password: "241FA04A40" },
    { username: "Kafaitullah", password: "241FA04F81" }
];

function login() {
    const u = username.value.trim();
    const p = password.value.trim();

    const found = USERS.find(user =>
        user.username === u && user.password === p
    );

    if (found) {
        localStorage.setItem("loggedIn", "true");
        window.location.href = "attendance.html";
    } else {
        error.textContent = "Access denied";
    }
}
</script>
</body>
</html>
